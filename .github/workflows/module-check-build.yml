name: Drag X TURBO module validation

on:
  push:
    paths:
      - "module.prop"
      - "action.sh"
      - "service.sh"
      - "uninstall.sh"
      - "system/**"
      - "backend/**"
      - "docs/**"
      - ".github/workflows/module-check-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "Drag X TURBO 0.4.0.zip"
          zip -qr9 "Drag X TURBO 0.4.0.zip" module.prop action.sh service.sh uninstall.sh system backend docs
          unzip -t "Drag X TURBO 0.4.0.zip"
          sha256sum "Drag X TURBO 0.4.0.zip"
      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: Drag X TURBO 0.4.0
          path: "Drag X TURBO 0.4.0.zip"
          retention-days: 30
