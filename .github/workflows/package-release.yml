name: Package Drag X TURBO 0.4.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.4.0'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build module ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f "dist/Drag X TURBO 0.4.0.zip"

          test -x system/bin/dragxctl
          for payload in GAP32 GAP64 vmtouch32 vmtouch64; do
            test -x "system/bin/$payload"
          done

          test -f backend/components/prefetch/game-db/gamelist.txt.gz.b64
          base64 -d backend/components/prefetch/game-db/gamelist.txt.gz.b64 | gzip -d > backend/components/prefetch/game-db/gamelist.txt
          test -s backend/components/prefetch/game-db/gamelist.txt
          zip -qr "dist/Drag X TURBO 0.4.0.zip" . \
            -x '.git/*' 'dist/*' '.github/workflows/*'
          sha256sum "dist/Drag X TURBO 0.4.0.zip" > "dist/Drag X TURBO 0.4.0.zip.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0
          name: Drag X TURBO 0.4.0
          generate_release_notes: true
          files: |
            dist/Drag X TURBO 0.4.0.zip
            dist/Drag X TURBO 0.4.0.zip.sha256